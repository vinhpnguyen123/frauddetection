[project]
name = "frauddetection-embedder"
version = "0.1.0"
description = "Embedding and reranking service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Kept optional so CI can test the service without installing torch or downloading weights.
ml = [
    "einops>=0.8.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    # nomic-embed's Hub code calls get_extended_attention_mask, removed in transformers 5.17.
    "transformers>=5.0,<5.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# Only installed with the `ml` extra, and ships no types CI can see.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
